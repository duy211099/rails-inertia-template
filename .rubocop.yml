# Omakase Ruby styling for Rails
plugins:
  - rubocop-rspec

inherit_gem: { rubocop-rails-omakase: rubocop.yml }

AllCops:
  NewCops: enable
  Exclude:
    - "node_modules/**/*"
    - "vendor/**/*"
    - "db/schema.rb"
    - "bin/*"

# Overwrite or add rules to create your own house style
Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

Style/StringLiterals:
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120
  Exclude:
    - "config/initializers/*"

# Contract examples keep related assertions together, with failure aggregation.
RSpec/ExampleLength:
  Max: 15
  CountAsOne: [array, hash, heredoc]

RSpec/DescribeClass:
  Exclude:
    - "spec/runtime/**/*"
    - "spec/requests/**/*"
    - "spec/resources/**/*"

RSpec/MultipleExpectations:
  Max: 5
