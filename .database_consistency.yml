# Database Consistency configuration
# See: https://github.com/djezzzl/database_consistency
#
# database_consistency 3 loads this file with YAML.safe_load (no symbols) and
# reads global toggles under the DatabaseConsistencyCheckers/All namespace.

# Enable all checkers by default
DatabaseConsistencyCheckers:
  All:
    enabled: true

# Disable a specific checker, e.g.:
# ColumnPresenceChecker:
#   enabled: false

# Ignore specific models or columns, e.g.:
# User:
#   email:
#     enabled: false

# Log settings (string, not a symbol, in v3)
log_level: warn

# Devise's conditional email validator is not understood by the static checker.
# spec/models/user_spec.rb covers the actual password-account requirement.
User:
  email:
    ColumnPresenceChecker:
      enabled: false
  # Devise generates collision-checked reset tokens; the unique index is the
  # final race-safety constraint, not an input validation rule.
  index_users_on_reset_password_token:
    UniqueIndexChecker:
      enabled: false
