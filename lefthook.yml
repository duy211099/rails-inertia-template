# Lefthook configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    biome:
      glob: "**/*.{js,jsx,ts,tsx,mjs,cjs}"
      run: npx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    tailwind:
      glob: "app/frontend/**/*.{ts,tsx}"
      run: npx eslint {staged_files}

    rubocop:
      glob: "{**/*.rb,**/*.rake,Gemfile,Rakefile,config.ru}"
      exclude:
        - "db/schema.rb"
        - "vendor/**/*"
      run: bundle exec rubocop -A {staged_files}
      stage_fixed: true

    typescript:
      glob: "**/*.{ts,tsx}"
      run: npm run check

pre-push:
  parallel: true
  commands:
    backend-test:
      run: bin/test

    frontend-test:
      run: npm test

    biome-lint:
      run: npm run biome:check

    tailwind-lint:
      run: npm run lint:tailwind
