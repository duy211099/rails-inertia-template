name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Brakeman
        run: bin/brakeman --no-pager

      - name: Bundler Audit
        run: bin/bundler-audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Cache RuboCop
        uses: actions/cache@v6
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}

      - name: RuboCop
        run: bin/rubocop -f github

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install JS deps
        run: npm ci

      - name: TypeScript and frontend lint
        run: npm run check && npm run biome:check && npm run lint:tailwind

      - name: Frontend unit tests
        run: npm test

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install JS deps
        run: npm ci

      - name: Prepare database and verify consistency
        env:
          RAILS_ENV: test
          TYPELIZER: "false"
        run: bin/rails db:prepare && bundle exec database_consistency

      - name: Cache Vite test build
        uses: actions/cache@v6
        with:
          path: public/vite-test
          key: vite-test-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vite.config.*', 'config/vite.json', 'app/frontend/**') }}

      - name: Backend specs (parallel)
        env:
          RAILS_ENV: test
          PARALLEL_TEST_PROCESSORS: 2
        run: bin/test
