openapi: 3.1.0
info:
  title: Items API
  version: 1.0.0
  description: |
    Session-authenticated example API sharing the Inertia app's items.
    Sign in through the web app first. Send its session cookie on requests and
    the page's csrf-token meta value as X-CSRF-Token on POST, PATCH, PUT, DELETE.
    Request fields use snake_case; Alba response fields use camelCase.
servers:
  - url: /
security:
  - session: []
paths:
  /api/v1/items:
    get:
      operationId: listItems
      summary: List the current user's kept items
      description: Sorted by created_at descending, then id descending. Out-of-range pages are empty.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 999999999
            default: 1
        - name: limit
          in: query
          description: Defaults to 12; values above 100 are capped at 100.
          schema:
            type: integer
            minimum: 1
            maximum: 999999999
            default: 12
      responses:
        '200':
          description: Paginated items
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, pagy]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Item'
                  pagy:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    post:
      operationId: createItem
      summary: Create an item owned by the current user
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemInput'
      responses:
        '201':
          description: Created item
          headers:
            Location:
              description: URL of the new item
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getItem
      summary: Show an owned, kept item
      responses:
        '200':
          $ref: '#/components/responses/Item'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateItem
      summary: Update supplied fields of an owned item
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/UpdateItem'
      responses:
        '200':
          $ref: '#/components/responses/Item'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    put:
      operationId: putItem
      summary: Update supplied fields of an owned item (same partial-update behavior as PATCH)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/UpdateItem'
      responses:
        '200':
          $ref: '#/components/responses/Item'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteItem
      summary: Soft-delete an owned item
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Deleted; no response body
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: _rails_inertia_template_session
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: csrf-token meta value from a page loaded after signing in
      schema:
        type: string
  requestBodies:
    UpdateItem:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [item]
            properties:
              item:
                $ref: '#/components/schemas/ItemAttributes'
  responses:
    Item:
      description: Item
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ItemResponse'
    Error:
      description: |
        JSON error. Codes: bad_request (400), unauthorized (401), forbidden (403),
        not_found (404), validation_failed or invalid_csrf_token (422).
        Other users' items and discarded items return 404.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error]
            properties:
              error:
                type: object
                additionalProperties: false
                required: [code, message, details]
                properties:
                  code:
                    type: string
                    enum: [bad_request, unauthorized, forbidden, not_found, validation_failed, invalid_csrf_token]
                  message:
                    type: string
                  details:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
  schemas:
    ItemAttributes:
      type: object
      minProperties: 1
      description: Unknown fields are ignored; ownership cannot be assigned by a client.
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: [string, 'null']
        phone_number:
          type: [string, 'null']
    CreateItemInput:
      type: object
      required: [item]
      properties:
        item:
          allOf:
            - $ref: '#/components/schemas/ItemAttributes'
            - required: [name]
    ItemResponse:
      type: object
      additionalProperties: false
      required: [item]
      properties:
        item:
          $ref: '#/components/schemas/Item'
    Item:
      type: object
      additionalProperties: false
      required: [id, name, description, phoneNumber, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: [string, 'null']
        phoneNumber:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Pagination:
      type: object
      additionalProperties: false
      required: [count, page, limit, pages, last, in, from, to, next, prev]
      properties:
        count:
          type: integer
        page:
          type: integer
        limit:
          type: integer
          minimum: 1
          maximum: 100
        pages:
          type: integer
        last:
          type: integer
        in:
          type: integer
        from:
          type: integer
        to:
          type: integer
        next:
          type: [integer, 'null']
        prev:
          type: [integer, 'null']
