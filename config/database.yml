# PostgreSQL. Versions 9.3 and up are supported.
#
#   gem install pg
#
#   Ensure the PostgreSQL gem is defined in your Gemfile
#   gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  # Defaults to the OS user, matching local peer/trust auth (no password needed).
  # Set DB_USERNAME/DB_PASSWORD to override for a role-based setup.
  username: <%= ENV.fetch("DB_USERNAME", ENV["USER"]) %>
  password: <%= ENV["DB_PASSWORD"] %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  primary:
    <<: *default
    database: rails_inertia_template_development
  cache:
    <<: *default
    database: rails_inertia_template_development_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: rails_inertia_template_development_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: rails_inertia_template_development_cable
    migrations_paths: db/cable_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
    database: rails_inertia_template_test<%= ENV["TEST_ENV_NUMBER"] %>
  cache:
    <<: *default
    database: rails_inertia_template_test<%= ENV["TEST_ENV_NUMBER"] %>_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: rails_inertia_template_test<%= ENV["TEST_ENV_NUMBER"] %>_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: rails_inertia_template_test<%= ENV["TEST_ENV_NUMBER"] %>_cable
    migrations_paths: db/cable_migrate

production:
  primary:
    <<: *default
    database: rails_inertia_template_production
    username: <%= ENV.fetch("DB_USERNAME", "rails_inertia_template") %>
    password: <%= ENV["DB_PASSWORD"] %>
  cache:
    <<: *default
    database: rails_inertia_template_production_cache
    username: <%= ENV.fetch("DB_USERNAME", "rails_inertia_template") %>
    password: <%= ENV["DB_PASSWORD"] %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: rails_inertia_template_production_queue
    username: <%= ENV.fetch("DB_USERNAME", "rails_inertia_template") %>
    password: <%= ENV["DB_PASSWORD"] %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: rails_inertia_template_production_cable
    username: <%= ENV.fetch("DB_USERNAME", "rails_inertia_template") %>
    password: <%= ENV["DB_PASSWORD"] %>
    migrations_paths: db/cable_migrate
